[workspace]
members = ["vexaim", "vendor/vex-v5-serial", "vendor/vex-cdc"]
# Build only the CLI by default: it enables just the USB feature of vex-v5-serial, so no Bluetooth/libdbus.
default-members = ["vexaim"]
resolver = "3"

[workspace.dependencies]
# Vendored copies of vexide/vex-v5-serial (MIT) with two small patches; see vendor/README.md.
vex-cdc = { version = "0.1.0", path = "vendor/vex-cdc" }
vex-v5-serial = { version = "0.5.1", path = "vendor/vex-v5-serial" }

[profile.release]
opt-level = "s"
lto = true
strip = true
