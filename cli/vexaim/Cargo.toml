[package]
name = "vexaim"
version = "0.2.0-dev"
edition = "2024"
description = "Run MicroPython and capture camera frames on a VEX AIM over USB or Bluetooth"
license = "Apache-2.0"
repository = "https://github.com/Tingsters/vex-aim-agent-workshop"

[features]
default = ["bluetooth"]
bluetooth = ["vex-v5-serial/bluetooth", "dep:btleplug", "dep:tokio", "dep:keyring", "dep:rpassword", "dep:uuid", "dep:tempfile"]
# Use the thread-based serial adapter that Windows uses, on any OS (for testing it).
blocking-io = ["vex-v5-serial/blocking-io"]

[dependencies]
vex-v5-serial = { workspace = true, features = ["serial"], default-features = false }
smol = "2.0.2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
btleplug = { version = "0.13.5", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
keyring = { version = "3.6.1", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
rpassword = { version = "7.5", optional = true }
uuid = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
