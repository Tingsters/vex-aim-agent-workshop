name: workshop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: macos-14, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check teaching skill and documentation
        run: python dev/check-workshop.py
      - name: Download native published CLI assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo Tingsters/vexaim-cli --dir dist/cli-assets \
            --pattern 'vexaim-${{ matrix.target }}*' --pattern VERSION \
            --pattern SHA256SUMS --pattern install.sh --pattern install.ps1
      - name: Test Unix installation and failure handling
        if: runner.os != 'Windows'
        run: sh dev/test-install.sh dist/cli-assets
      - name: Test Windows PowerShell 7 and 5.1 installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dev/test-install.ps1 -AssetsDir dist/cli-assets
          powershell -NoProfile -ExecutionPolicy Bypass -File dev/test-install.ps1 -AssetsDir dist/cli-assets
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 integration failed' }
      - name: Check latest-stable Unix bootstrap
        if: runner.os != 'Windows'
        run: sh install.sh --home "$PWD/dist/online-smoke" --agents codex
      - name: Check latest-stable Windows bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -TargetHome "$PWD/dist/online-smoke" -Agents codex
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -TargetHome "$PWD/dist/online-ps5" -Agents codex
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 online install failed' }
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh install.sh dev/test-install.sh
