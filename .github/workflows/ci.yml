name: workshop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'CLI release to install, for example 0.3.0-rc.6 (empty selects latest stable)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: macos-14, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check teaching skill and documentation
        run: python dev/check-workshop.py
      - name: Download native published CLI assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          release=()
          if [ -n "$CLI_VERSION" ]; then
            [[ "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || exit 1
            release+=("v$CLI_VERSION")
          fi
          gh release download "${release[@]}" --repo Tingsters/vexaim-cli --dir dist/cli-assets \
            --pattern 'vexaim-${{ matrix.target }}*' --pattern VERSION \
            --pattern SHA256SUMS --pattern install.sh --pattern install.ps1
      - name: Test Unix installation and failure handling
        if: runner.os != 'Windows'
        run: sh dev/test-install.sh dist/cli-assets
      - name: Test Windows PowerShell 7 and 5.1 installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dev/test-install.ps1 -AssetsDir dist/cli-assets
          powershell -NoProfile -ExecutionPolicy Bypass -File dev/test-install.ps1 -AssetsDir dist/cli-assets
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 integration failed' }
      - name: Check online Unix bootstrap
        if: runner.os != 'Windows'
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          if [ -n "$CLI_VERSION" ]; then
            cat install.sh | sh -s -- --home "$PWD/dist/online-smoke" --agents codex \
              --base-url "https://github.com/Tingsters/vexaim-cli/releases/download/v$CLI_VERSION"
          else
            cat install.sh | sh -s -- --home "$PWD/dist/online-smoke" --agents codex
          fi
          actual=$(dist/online-smoke/.agents/skills/vex-aim/bin/vexaim --version)
          expected=$(tr -d '\r\n' < dist/cli-assets/VERSION)
          test "$actual" = "vexaim $expected"
      - name: Check online Windows bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          if ($env:CLI_VERSION) {
            $baseUrl="https://github.com/Tingsters/vexaim-cli/releases/download/v$env:CLI_VERSION"
            & ([scriptblock]::Create((Get-Content -Raw install.ps1))) -BaseUrl $baseUrl
            powershell -NoProfile -ExecutionPolicy Bypass -Command '& ([scriptblock]::Create((Get-Content -Raw install.ps1))) -BaseUrl ("https://github.com/Tingsters/vexaim-cli/releases/download/v"+$env:CLI_VERSION)'
          } else {
            Get-Content -Raw install.ps1 | iex
            powershell -NoProfile -ExecutionPolicy Bypass -Command 'Get-Content -Raw install.ps1 | iex'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 online install failed' }
          if (-not (Test-Path "$HOME/.agents/skills/vex-aim-workshop/references/activities.md")) { throw 'Streamed installation did not install teaching references' }
          $actual=& "$HOME/.agents/skills/vex-aim/bin/vexaim.exe" --version
          $expected=(Get-Content -Raw dist/cli-assets/VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or "$actual" -ne "vexaim $expected") { throw 'Online installation selected a different CLI release' }
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh install.sh dev/test-install.sh
